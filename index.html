/* ===== 농장 원화 톤 테마 (따뜻한 양피지·나무) ===== */
:root{--fk:#2a1712;--fw:#7a4a26;--fp:#fff3d6;--fp2:#f3ddb0;--ft:#4a2a14;--fg:#6fbf45;--fg2:#4a9a30}
#screen{background:#5a8a3a!important;box-shadow:inset 0 0 0 2px var(--fk)!important}
#screen .ov{background:radial-gradient(ellipse at 50% 40%,rgba(255,230,170,.18),rgba(42,23,18,.72) 75%)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important}

/* 제목 로고 */
.flogo{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:4px;animation:flb 3s ease-in-out infinite}
@keyframes flb{50%{transform:translateY(-4px)}}
.fl-en{font-size:15px;color:#fff3c4;background:linear-gradient(#8a5a34,#6b4224);border:3px solid var(--fk);border-radius:20px;padding:3px 14px 2px;box-shadow:0 3px 0 var(--fk);position:relative;z-index:2;margin-bottom:-10px}
.fl-ko{font-size:58px;line-height:1.05;color:#ffe680;-webkit-text-stroke:9px var(--fk);paint-order:stroke fill;text-shadow:0 6px 0 var(--fk),0 0 20px rgba(255,200,80,.35);padding:8px 6px 0;background:linear-gradient(#fff6b8 20%,#ffcf4a 65%,#ff9f2a);-webkit-background-clip:text;background-clip:text}
.fl-deco{display:flex;gap:4px;margin-top:2px}.fl-deco i{width:34px;height:34px;background:center/contain no-repeat;filter:drop-shadow(0 2px 0 rgba(42,23,18,.6));animation:flb 2.4s ease-in-out infinite}
.fl-deco i:nth-child(2n){animation-delay:-.8s}.fl-deco i:nth-child(3n){animation-delay:-1.5s}
/* 버튼 */

#screen .phS-b:active,.phT .phS-b:active,#screen .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--fk),inset 0 2px 0 rgba(255,255,255,.55)!important}
#screen .phS-b.phS-how,#screen .btn{background:linear-gradient(var(--fp),var(--fp2))!important;color:var(--ft)!important;-webkit-text-stroke:0!important;font-size:17px!important}

#screen .phS-credit{color:#fff3d6!important;font-size:13px!important;line-height:1.6!important;text-shadow:0 1px 0 var(--fk),0 0 6px var(--fk)!important;opacity:.95}

(()=>{
const $=id=>document.getElementById(id);
const RANK_URL='https://script.google.com/macros/s/AKfycbzkdjVleobj98oyxlC77cUf5txCRiSB6D1zgRWU56pX22ElXAx9R8xFRGnV0nKAUbwC/exec';
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const PIX={pause:['........','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','.11..11.','........'],note:['....111.','....1111','....1..1','....1...','....1...','.1111...','11111...','.111....'],trophy:['.111111.','11111111','1.1111.1','.111111.','..1111..','...11...','..1111..','.111111.']};
function pixIcon(k){const m=PIX[k];let r='';m.forEach((row,y)=>[...row].forEach((v,xx)=>{if(v==='1')r+=`<rect x="${xx}" y="${y}" width="1.02" height="1.02"/>`}));return `<i class="pix"><svg viewBox="0 0 ${m[0].length} ${m.length}" shape-rendering="crispEdges" fill="currentColor">${r}</svg></i>`}
document.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=pixIcon(el.dataset.ic).replace('<i class="pix"','<i class="pix" data-ic="'+el.dataset.ic+'"')});
const OL='#2a1712'; // 외곽선 색 (쿠키런 느낌 두꺼운 갈색 선)

/* ===== 팡팡이 (구슬·하트 몸체 · 앞면 얼굴) ===== */
const CH=[ // 몸체는 구슬 또는 하트만 · 얼굴은 앞면에만 (f: 표정)
 {n:'퍼플팡',c:'#9b5cff',l:'#e2ccff',d:'#5a28c8',s:'ball',f:'kiss',no:1},
 {n:'하트팡',c:'#ff6fae',l:'#ffd0e4',d:'#d43c80',s:'heart',f:'sparkle',no:2},
 {n:'그린팡',c:'#9be03a',l:'#e4ffb8',d:'#5aa818',s:'ball',f:'happy',no:3},
 {n:'블루팡',c:'#4fc3ff',l:'#d0f0ff',d:'#1f86d0',s:'ball',f:'round',no:4},
 {n:'민트팡',c:'#2fcf7a',l:'#c8f7dc',d:'#16904e',s:'ball',f:'happy',no:5},
 {n:'옐로우팡',c:'#ffd23f',l:'#fff4c0',d:'#d99a00',s:'ball',f:'round',no:6},
 {n:'오렌지팡',c:'#ff9a3d',l:'#ffe0c0',d:'#d0600f',s:'ball',f:'sparkle',no:7},
 {n:'레드팡',c:'#ff4d5a',l:'#ffc8cc',d:'#c41e2e',s:'ball',f:'kiss',no:8}];
CH.forEach(c=>c.k=c.c);
/* ===== 팡팡이 원화 8종 (512캔버스·발밑 256,448 → 256 저장) ===== */
const PANG=[['purple','퍼플팡'],['lime','그린팡'],['sky','블루팡'],['green','민트팡'],['yellow','옐로우팡'],['orange','오렌지팡'],['red','레드팡'],['cream','베이지팡']];
const PANG_OLD=['purple','red','lime','sky','green','yellow','orange','red']; // 예전 저장 S.ch(숫자) → 새 id (하트팡→빨강팡)
const PIMG={};PANG.forEach(([id])=>{const im=new Image();im.onload=()=>{PIMG[id]=im};im.src='art/ch/pang_'+id+'.png?v='+(typeof V!=='undefined'?V:'')});
function pangId(ch){if(typeof ch==='string'&&PANG.some(p=>p[0]===ch))return ch;return PANG_OLD[ch|0]||'purple'}

function shapeParts(s,r){ // 팡팡이 모양 (중심 0,0 · 반지름 r) → Path2D 묶음
 const P=[];const p=()=>{const q=new Path2D();P.push(q);return q};
 if(s==='heart'){const q=p(),f=r/17;q.moveTo(0,16*f);q.bezierCurveTo(-12*f,9*f,-17*f,2*f,-17*f,-5*f);q.bezierCurveTo(-17*f,-12*f,-12*f,-16*f,-7*f,-16*f);q.bezierCurveTo(-3*f,-16*f,-1*f,-14*f,0,-11*f);q.bezierCurveTo(1*f,-14*f,3*f,-16*f,7*f,-16*f);q.bezierCurveTo(12*f,-16*f,17*f,-12*f,17*f,-5*f);q.bezierCurveTo(17*f,2*f,12*f,9*f,0,16*f);q.closePath()}
 else if(s==='star'){const q=p();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.58:r*1.05;const X=Math.cos(a)*rad,Y=Math.sin(a)*rad+r*.06;i?q.lineTo(X,Y):q.moveTo(X,Y)}q.closePath()}
 else if(s==='drop'){const q=p();q.moveTo(0,-r*1.15);q.bezierCurveTo(r*.35,-r*.55,r*.95,-r*.1,r*.95,r*.3);q.arc(0,r*.3,r*.95,0,Math.PI);q.bezierCurveTo(-r*.95,-r*.1,-r*.35,-r*.55,0,-r*1.15);q.closePath()}
 else if(s==='cloud'){for(const [x,y,k] of [[-.5,.2,.55],[.5,.2,.55],[0,-.15,.62],[-.25,.4,.5],[.25,.4,.5]]){const q=p();q.arc(x*r,y*r,k*r,0,7)}}
 else if(s==='dia'){const q=p();q.moveTo(0,-r);q.lineTo(r*.9,-r*.15);q.lineTo(0,r*1.02);q.lineTo(-r*.9,-r*.15);q.closePath()}
 else if(s==='clover'){for(const [x,y] of [[0,-.45],[-.45,0],[.45,0],[0,.45]]){const q=p();q.arc(x*r,y*r,r*.52,0,7)}const q=p();q.arc(0,0,r*.4,0,7)}
 else{const q=p();q.arc(0,0,r,0,7)}
 return P}
const FACEC='#4a2a1e';
function drawFace(g,f,r,ey){g.save();g.strokeStyle=FACEC;g.fillStyle=FACEC;g.lineCap='round';g.lineJoin='round';const e=r*.3,lw=Math.max(1.5,r*.075);g.lineWidth=lw;
 g.fillStyle='rgba(255,110,140,.4)';for(const sx of[-1,1]){g.beginPath();g.ellipse(sx*r*.5,ey+r*.2,r*.13,r*.075,0,0,7);g.fill()}g.fillStyle=FACEC;
 if(f==='kiss'){for(const sx of[-1,1]){g.beginPath();g.arc(sx*e,ey-r*.02,r*.11,Math.PI*.15,Math.PI*.85);g.stroke()}g.beginPath();g.ellipse(0,ey+r*.2,r*.06,r*.08,0,0,7);g.lineWidth=lw*.9;g.stroke()}
 else if(f==='sparkle'){for(const sx of[-1,1]){g.beginPath();g.ellipse(sx*e,ey,r*.1,r*.14,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(sx*e+r*.035,ey-r*.05,r*.045,0,7);g.fill();g.beginPath();g.arc(sx*e-r*.03,ey+r*.05,r*.02,0,7);g.fill();g.fillStyle=FACEC}g.beginPath();g.arc(0,ey+r*.12,r*.14,.15*Math.PI,.85*Math.PI);g.stroke()}
 else if(f==='happy'){for(const sx of[-1,1]){g.beginPath();g.arc(sx*e,ey+r*.04,r*.1,Math.PI*1.15,Math.PI*1.85);g.stroke()}g.beginPath();g.arc(0,ey+r*.12,r*.15,.12*Math.PI,.88*Math.PI);g.stroke()}
 else{for(const sx of[-1,1]){g.beginPath();g.arc(sx*e,ey,r*.085,0,7);g.fill()}g.beginPath();g.arc(0,ey+r*.13,r*.12,.15*Math.PI,.85*Math.PI);g.stroke()}
 g.restore()}

function drawPang0(g,ch,cx,cy,r,face,back){ // 탱글한 구슬/하트 · 큰 흰 반사광 · 앞면 얼굴
 const C=CH[ch],P=shapeParts(C.s,r);g.save();g.translate(cx,cy);g.lineJoin='round';
 g.strokeStyle=C.d;g.lineWidth=Math.max(1.5,r*.08);for(const q of P)g.stroke(q);
 const gr=g.createRadialGradient(-r*.3,-r*.4,r*.1,0,0,r*1.1);gr.addColorStop(0,C.l);gr.addColorStop(.5,C.c);gr.addColorStop(1,C.d);g.fillStyle=gr;for(const q of P)g.fill(q);
 g.save();const clip=new Path2D();for(const q of P)clip.addPath(q);g.clip(clip);
 g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.ellipse(-r*.36,-r*.46,r*.3,r*.16,-.55,0,7);g.fill();g.beginPath();g.arc(r*.45,r*.38,r*.06,0,7);g.fill();
 g.fillStyle='rgba(0,0,0,.1)';g.beginPath();g.ellipse(r*.1,r*.9,r*.9,r*.32,0,0,7);g.fill();g.restore();
 if(face&&!back)drawFace(g,C.f,r,C.s==='heart'?-r*.08:r*.02);
 g.restore()}

 store.get=k=>k==='farm-save'?json:(k.startsWith('pfTour')||k.startsWith('pfHint')?'1':_g(k));store.set=(k,v)=>{if(k!=='farm-save')_s(k,v)};save=function(){};window.__visitS=()=>S;
 const go=()=>{try{unlock()}catch(_){}if(load()){begin();S.vis=1;try{localStorage.setItem('pfTourOff','1')}catch(_){}
  const bar=document.createElement('div');bar.id='visitBar';bar.innerHTML=`<span>${(d.name||'팡팡농장').replace(/</g,'')} 구경 중</span><button>내 농장으로</button>`;$('screen').appendChild(bar);bar.addEventListener('pointerdown',e=>e.stopPropagation());bar.querySelector('button').onclick=()=>{location.href=location.pathname};toast('친구 농장을 둘러봐요 · 톡 눌러 걸어가요')}};
 if(document.readyState==='complete')setTimeout(go,300);else addEventListener('load',()=>setTimeout(go,300))})();
(function(){const _d=decide;decide=function(){if(VISIT)return null;return _d()}})();

/* ===== 마을: 친구 농장 실시간 구경 (구글 Apps Script 서버) ===== */
const VURL='https://script.google.com/macros/s/AKfycbzhlNrUpeHw1pXgJy95YYhJ3j5Pvq9A0pfxboREzh8tspnnHHPi7fhx8CWwh33jhLg/exec';
const rid=n=>{const c='abcdefghijklmnopqrstuvwxyz0123456789';let s2='';const a=crypto.getRandomValues(new Uint8Array(n));for(const v of a)s2+=c[v%36];return s2};
function myVil(){let id=null,key=null;try{id=localStorage.getItem('pfVid');key=localStorage.getItem('pfVkey')}catch(_){}if(!id){id=rid(10);key=rid(16);try{localStorage.setItem('pfVid',id);localStorage.setItem('pfVkey',key)}catch(_){}}return{id,key}}
function snapObj(){return{v:1,ch:S.ch,name:S.name,day:S.day,min:S.min,gold:0,G:S.G.map(r=>r.join('')),O:packO().map(o=>({...o,v:o.v!=null?Math.min(.99,Math.floor(o.v*100)/100):o.v})),C:S.C.map(r=>r.map(c=>c?{k:c.k,age:c.age,w:c.w}:0)),pl:{x:6.5,y:7.6,fx:0,fy:1,mv:0},ck:(S.ck||[]).map(c=>({x:c.x,y:c.y})),land:S.land,lv:S.lv,inv:[],orders:[],st:S.st,rv:S.rv,fire1:1,vis:1}}
const posStr=()=>{const P=S.pl;return[P.x.toFixed(2),P.y.toFixed(2),(P.fx||0).toFixed(2),(P.fy||0).toFixed(2),P.mv?1:0,pangId(S.ch)].join(',')};
let VPUB=0,VPOS=0,VLASTPOS='',VBUSY=0;
async function vilPush(full){if(VISIT||!S||VBUSY)return;const me=myVil();VBUSY=1;try{const b={id:me.id,key:me.key,pos:posStr()};if(full){const d=b64u(await zip(JSON.stringify(snapObj())));if(d.length>8400){VBUSY=0;return}Object.assign(b,{data:d,name:S.name||'팡팡농장',lv:S.lv||1,day:S.day||1})}
 await fetch(VURL,{method:'POST',body:JSON.stringify(b)})}catch(_){}VBUSY=0}
(function(){const _s=save;save=function(){_s.apply(this,arguments);if(!VISIT&&Date.now()-VPUB>15000){VPUB=Date.now();vilPush(true)}}})();
setInterval(()=>{if(VISIT||!S||state!=='play')return;const ps=posStr();if(ps!==VLASTPOS&&Date.now()-VPOS>3000){VLASTPOS=ps;VPOS=Date.now();vilPush(Date.now()-VPUB>60000?(VPUB=Date.now(),true):false)}},1000);
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'지금 놀고 있어요':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'}
async function openVillage(){openPanel('마을','<div class="it"><div></div><div><small>친구들 농장을 불러오는 중…</small></div><div></div></div>');let L=[];try{L=(await (await fetch(VURL+'?a=list')).json()).farms||[]}catch(_){}
 const me=myVil().id;L=L.filter(f=>f.id!==me&&!/^test/.test(f.id));if(!$('ovPanel').classList.contains('show'))return;
 $('pnL').innerHTML=(L.length?L.map(f=>`<div class="it"><canvas width="80" height="80" data-ic="house"></canvas><div><b>${String(f.name||'팡팡농장').replace(/</g,'')}</b><small>Lv ${f.lv} · ${f.day}일차 · ${ago(f.t)}</small></div><button data-a="vil:${f.id}">구경</button></div>`).join(''):'<div class="it"><div></div><div><small>아직 마을에 다른 농장이 없어요. 친구에게 팡팡농장을 알려 주세요!</small></div><div></div></div>');
 $('pnL').querySelectorAll('canvas[data-ic]').forEach(c=>drawIcon(c.getContext('2d'),c.dataset.ic,80))}
$('pnL').addEventListener('click',e=>{const b=e.target.closest('button[data-a^="vil:"]');if(!b)return;e.stopPropagation();try{save()}catch(_){}location.href=location.pathname+'#live='+b.dataset.a.slice(4)},true);
(function(){const sb=document.createElement('button');sb.className='btn';sb.id='bVillage';sb.textContent='마을 구경';const ch=$('bShareFarm')||$('bChar');if(ch)ch.parentNode.insertBefore(sb,ch);sb.onclick=e=>{e.stopPropagation();try{menu(false)}catch(_){}openVillage()}})();
/* 실시간 구경 */
let FRIEND=null;
(async function(){const h=location.hash;if(!h.startsWith('#live='))return;const id=h.slice(6);let r;try{r=await (await fetch(VURL+'?a=get&id='+encodeURIComponent(id))).json()}catch(_){}
 if(!r||!r.data){toast('농장을 찾을 수 없어요');return}VISIT=1;document.documentElement.classList.add('visiting');let json=await unzip(ub64(r.data));{const d=JSON.parse(json);d.last=Date.now();json=JSON.stringify(d)}
 const _g=store.get,_s=store.set;store.get=k=>k==='farm-save'?json:(k.startsWith('pfTour')||k.startsWith('pfHint')?'1':_g(k));store.set=(k,v)=>{if(k!=='farm-save')_s(k,v)};save=function(){};
 let T=r.t;const setPos=ps=>{if(!ps)return;const a=ps.split(',');FRIEND=FRIEND||{};const nx=+a[0],ny=+a[1];FRIEND.tx=nx;FRIEND.ty=ny;if(FRIEND.x==null){FRIEND.x=nx;FRIEND.y=ny}FRIEND.fx=+a[2];FRIEND.fy=+a[3];FRIEND.ch=a[5]||'purple'};
 const go=()=>{try{unlock()}catch(_){}if(load()){begin();setPos(r.pos);
  const bar=document.createElement('div');bar.id='visitBar';bar.innerHTML=`<span>${String(r.name||'팡팡농장').replace(/</g,'')} · 실시간</span><button>내 농장으로</button>`;$('screen').appendChild(bar);bar.addEventListener('pointerdown',e=>e.stopPropagation());bar.querySelector('button').onclick=()=>{location.href=location.pathname};toast('친구 농장에 놀러 왔어요 · 바뀌면 바로 보여요');
  setInterval(async()=>{try{const q=await (await fetch(VURL+'?a=get&id='+encodeURIComponent(id)+'&since='+T)).json();if(q.pos)setPos(q.pos);if(!q.same&&q.data){T=q.t;const d=JSON.parse(await unzip(ub64(q.data)));d.last=Date.now();json=JSON.stringify(d);const pl={...S.pl};if(load()){S.pl=pl;GD=1}}}catch(_){}},4000)}};
 if(document.readyState==='complete')setTimeout(go,300);else addEventListener('load',()=>setTimeout(go,300))})();

(function(){const _l=landDeco;landDeco=function(L,t){_l(L,t);if(!FRIEND||!VISIT)return;const F=FRIEND,dx=F.tx-F.x,dy=F.ty-F.y,d=Math.hypot(dx,dy);if(d>.02){const sp=Math.min(d,.06);F.x+=dx/d*sp;F.y+=dy/d*sp;F.mv=1}else F.mv=0;
 L.push([F.x+F.y,()=>{const sp=S.pl,sc=S.ch;S.pl={x:F.x,y:F.y,fx:F.fx,fy:F.fy,mv:F.mv,dir:sp.dir};S.ch=F.ch;try{drawPlayer(t)}finally{S.pl=sp;S.ch=sc}const q=iso(F.x,F.y,1.9);x.save();x.font=`700 ${11*DPR}px Paperlogy,sans-serif`;x.textAlign='center';x.lineWidth=3*DPR;x.strokeStyle='#5a2e12';x.fillStyle='#fff6e0';const nm='친구';x.strokeText(nm,q[0],q[1]);x.fillText(nm,q[0],q[1]);x.restore()}])}})();
})();
