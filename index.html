.pi-sk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pi-sk>div{display:grid;grid-template-columns:22px 1fr;align-items:center;column-gap:5px;row-gap:3px;padding:7px 8px;border-radius:9px;background:#fff6e2;border:1.5px solid #e2c49a;color:#5c3a1f;text-align:left}

function pangId(ch){if(typeof ch==='string'&&PANG.some(p=>p[0]===ch))return ch;return PANG_OLD[ch|0]||'purple'}

function drawPangIdle(g,ch,fx,fy,size,t){const im=pangIdle(ch);if(!im)return false;const c=im.height,ph=t%4.2,bl=(ph>3.95&&ph<4.1)||(t%11.3>11.05&&t%11.3<11.17)?1:0;g.drawImage(im,bl*c,0,c,c,fx-size/2,fy-size*.875,size,size);return true}

 const P=[];const p=()=>{const q=new Path2D();P.push(q);return q};
