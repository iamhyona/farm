function shapeParts(s,r){ // 팡팡이 모양 (중심 0,0 · 반지름 r) → Path2D 묶음
 const P=[];const p=()=>{const q=new Path2D();P.push(q);return q};
 if(s==='heart'){const q=p(),f=r/17;q.moveTo(0,16*f);q.bezierCurveTo(-12*f,9*f,-17*f,2*f,-17*f,-5*f);q.bezierCurveTo(-17*f,-12*f,-12*f,-16*f,-7*f,-16*f);q.bezierCurveTo(-3*f,-16*f,-1*f,-14*f,0,-11*f);q.bezierCurveTo(1*f,-14*f,3*f,-16*f,7*f,-16*f);q.bezierCurveTo(12*f,-16*f,17*f,-12*f,17*f,-5*f);q.bezierCurveTo(17*f,2*f,12*f,9*f,0,16*f);q.closePath()}
 else if(s==='star'){const q=p();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.58:r*1.05;const X=Math.cos(a)*rad,Y=Math.sin(a)*rad+r*.06;i?q.lineTo(X,Y):q.moveTo(X,Y)}q.closePath()}

 else if(s==='cloud'){for(const [x,y,k] of [[-.5,.2,.55],[.5,.2,.55],[0,-.15,.62],[-.25,.4,.5],[.25,.4,.5]]){const q=p();q.arc(x*r,y*r,k*r,0,7)}}
 else if(s==='dia'){const q=p();q.moveTo(0,-r);q.lineTo(r*.9,-r*.15);q.lineTo(0,r*1.02);q.lineTo(-r*.9,-r*.15);q.closePath()}
 else if(s==='clover'){for(const [x,y] of [[0,-.45],[-.45,0],[.45,0],[0,.45]]){const q=p();q.arc(x*r,y*r,r*.52,0,7)}const q=p();q.arc(0,0,r*.4,0,7)}

  for(let y=0;y<MH;y++)for(let xx=0;xx<MW;xx++){const o=S.O[y][xx];if(o&&o.t==='sprinkler')for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const c=S.C[y+dy]&&S.C[y+dy][xx+dx];if(c)c.w=1}}
  for(let y=0;y<MH;y++)for(let xx=0;xx<MW;xx++){const c=S.C[y][xx];if(!c)continue;if(c.w&&c.age<CROPS[c.k].days)c.age++;c.w=0}
  S.wet={};S.rain=rain;if(rain)for(let y=0;y<MH;y++)for(let xx=0;xx<MW;xx++){const c=S.C[y][xx];if(c)c.w=1;if(S.G[y][xx]==='s')S.wet[y*MW+xx]=1}
  for(const c of S.ck){if(S.eggs<S.ck.length*7){S.eggs++;if(Math.random()<.04+(c.aff||0)*.025)S.geggs=(S.geggs||0)+1}c.pet=0}
  if(!away)for(let i=0;i<4;i++){const xx=3+(Math.random()*14|0),y=9+(Math.random()*(MH-12)|0);if(S.G[y][xx]==='g'&&!S.O[y][xx]&&!S.C[y][xx])S.O[y][xx]={t:'weed',x:xx,y,v:Math.random()}}}
 S.min=360;genOrders();GD=1}

 if(a==='buy'){const it=ITEM[v];if(S.gold<it.price)return;S.gold-=it.price;if(v==='chicken'){addChicken();toast('닭이 닭장 마당에 왔어요!');sfx.cluck()}else{give(v);sfx.coin()}hud();openShop()}

 else if(a==='ord'){const o=S.orders[+v];if(o&&!o.done&&take(o.id,o.q)){o.done=1;S.gold+=o.r;S.st.earn+=o.r;gainSell(o.r);sfx.get();toast(`주문 완료! +${o.r}G`);hud();openOrders()}}
 save()});

/* ===== 메뉴 ===== */
const show=id=>$(id).classList.add('show'),hide=id=>$(id).classList.remove('show');
function menu(on){if(!S||state!=='play')return;paused=on;if(on){$('pauseInfo').innerHTML=`${esc(S.name)} · ${S.day}일차<br>수확 ${S.st.hv}번 · 번 돈 ${S.st.earn.toLocaleString()}G · 닭 ${S.ck.length}마리`;show('ovPause')}else{hide('ovPause');actKey=''}}
$('bPause').onclick=()=>menu(!paused);$('bResume').onclick=()=>menu(false);$('bSleep2').onclick=()=>{menu(false);S.pl.x=4.6;S.pl.y=5.6;sleep()};
$('bMenu').onclick=()=>{save();hide('ovPause');paused=false;state='title';bgm(false);titleUI();show('ovTitle')};

/* ===== 시작 화면 ===== */
const TUT={"goal":"팡팡이와 함께 나만의 농장을 가꿔요!<br>땅 갈기 → 씨앗 심기 → 물 주기 → 자고 나면 쑥쑥<br>출하함에서 팔고 상점에서 씨앗·닭·꾸미기를 사요<br>주문 게시판의 주문을 채우면 보상이 더 커요","touch":[["⚡ 행동력","일하면 줄어요 · 음식 먹기·잠으로 회복"],["칸 톡","팡팡이가 가서 알맞은 일 하기"],["여러 칸 쓱","줄지어 차례로 일하기"],["팡팡이 톡","하던 일 멈추기"],["아래 칸","씨앗·물건 고르기"]],"pc":[["클릭 / 드래그","가서 일하기"],["WASD / 방향키","직접 걷기"],["SPACE / E","바라보는 칸에 행동"],["1~9 · ESC","물건 고르기 · 메뉴"]]};
let pick=0;
function titleUI(){$('bContinue').hidden=!store.get('farm-save');const sh2=$('show');sh2.innerHTML='';[0,1,2,5].forEach((ch,i)=>{const c=cnv(96,96);drawPang(c.getContext('2d'),ch,48,52,34,true,false);c.style.cssText='width:52px;height:52px;animation:kb 1.2s ease-in-out '+(-i*.3)+'s infinite';sh2.appendChild(c)})}
const st=document.createElement('style');st.textContent='#show{display:flex;gap:6px;justify-content:center}@keyframes kb{50%{transform:translateY(-6px)}}';document.head.appendChild(st);
$('chs').innerHTML=CH.map((c,i)=>`<button data-i="${i}"><canvas width="96" height="96"></canvas><span>${c.n}</span></button>`).join('');
$('chs').querySelectorAll('canvas').forEach((c,i)=>drawPang(c.getContext('2d'),i,48,50,32,true,false));
const chSync=()=>$('chs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===pick));chSync();
$('chs').onclick=e=>{const b=e.target.closest('button');if(b){pick=+b.dataset.i;chSync()}};
function begin(){ensureSign();hide('ovTitle');hide('ovNew');state='play';paused=false;drawInv();hud();actKey='';bgm(true);if(S.awayMsg){setTimeout(()=>toast(S.awayMsg),400);S.awayMsg=null}}
$('bContinue').onclick=()=>{unlock();if(load())begin()};
$('bNew').onclick=()=>{unlock();if(store.get('farm-save')&&!confirmNew)return askNew();hide('ovTitle');show('ovNew')};
let confirmNew=false;function askNew(){confirmNew=true;$('bNew').textContent='정말 새로? (한 번 더)';setTimeout(()=>{confirmNew=false;$('bNew').textContent='NEW FARM'},2500)}
$('bNewX').onclick=()=>{hide('ovNew');show('ovTitle')};
$('bStart').onclick=()=>{unlock();newGame(pick,$('farmName').value.trim());const go=()=>begin();if(window.phTut)phTut('farm-tut',TUT,go);else go()};

/* ===== 진행 ===== */
let last=0,saveT=0,actT=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-(last||t))/1000);last=t;const ts=t/1000;
 if(S&&state==='play'&&!paused){if(!move(dt))autoWalk(dt);chickens(dt);S.min+=dt/MIN_SEC;if(S.min>=1440)faint();
  saveT+=dt;if(saveT>10){saveT=0;save()}actT-=dt;if(actT<=0){actT=.1;actUpdate();hud()}}
 if(tipTm>0){tipTm-=dt;if(tipTm<=0)$('tip').textContent=''}
 if(S){render(ts);drawPops(dt)}else{x.fillStyle='#4f9a3a';x.fillRect(0,0,W,H)}}
resize();titleUI();
// 제목 화면 뒤 배경용 미리보기 농장
if(!load()){newGame(0,'',1);S.pl.x=8;S.pl.y=12}
requestAnimationFrame(loop);
if(location.hash==='#test')window.__f={iso:(a,b,h)=>iso(a,b,h),get TQ(){return TAPQ},get DPR(){return DPR},get S(){return S},set S(v){S=v},newGame,dayPass,decide,doAct,move,IN,KEY,begin,openShop,openSell,openOrders,closePanel,give,save,load,get state(){return state}};
/* ===== 알파: 행동력 · 레벨 · 가공 · 정산 · 기절 ===== */
var LVUNL={1:['turnip','carrot','potato','cabbage','flower','fence','bench','lamp','chicken'],3:['tomato','corn','keg_pickle'],5:['straw','pumpkin','mill','jam_maker'],8:['grape','wheat','keg_ferment'],10:['sprinkler','oven']};
function unlockLv(id){if(!LVUNL)return 1;for(const l in LVUNL)if(LVUNL[l].includes(id))return +l;return 1}
function unlocked(id){return !S||(S.lv||1)>=unlockLv(id)}
const LVMAX=20,xpNeed=l=>40+l*30;
const EN_MAX=100,COST={'땅 갈기':2,'심기':1,'물 주기':1,'수확':1,'돌 깨기':4,'풀 뽑기':4,'꽃 꺾기':1};
const RECIPES={
 keg_pickle:[{in:{carrot:2},out:'pickle'},{in:{turnip:3},out:'pickle'},{in:{potato:2},out:'pickle'},{in:{cabbage:1},out:'pickle'}],
 mill:[{in:{wheat:3},out:'flour'},{in:{corn:2},out:'cornmeal'}],
 jam_maker:[{in:{straw:3},out:'jam_straw'},{in:{grape:3},out:'jam_grape'}],
 keg_ferment:[{in:{grape:2},out:'juice_grape'},{in:{tomato:3},out:'juice_tomato'}],
 oven:[{in:{flour:1,egg:1},out:'bread'},{in:{pumpkin:1,flour:1},out:'pumpkin_pie'},{in:{potato:1,carrot:1,cabbage:1},out:'soup'}]};
function ensureAlpha(){if(!S)return;if(S.lv==null){S.lv=1;S.xp=0}if(S.en==null)S.en=EN_MAX;if(!S.mach)S.mach={};if(!S.today)S.today={earn:0,hv:0,made:0,xp:0}}
/* 경험치 */
function addXP(n,tx,ty){ensureAlpha();n=Math.round(n);if(n<=0)return;S.xp+=n;S.today.xp+=n;if(tx!=null)pop(tx,ty,`+${n} EXP`,'#9fe8ff');
 while(S.lv<LVMAX&&S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;const L=(LVUNL[S.lv]||[]).map(k=>ITEM[k]?ITEM[k].n:k);sfx.get();setTimeout(()=>toast(`레벨 ${S.lv}!`+(L.length?' · 새로 열림: '+L.join(', '):'')),300)}statUI()}
function gainSell(g){addXP(g/25)}
/* 행동력 */
function spend(c){ensureAlpha();if(S.en<c){toast('힘이 없어요… 음식을 먹거나 집에서 쉬어요');sfx.no();return false}S.en=Math.max(0,S.en-c);statUI();return true}
function eatSel(){const id=selId(),it=ITEM[id];if(!it||it.food==null)return false;ensureAlpha();if(S.en>=EN_MAX){toast('지금은 배불러요');return true}
 if(take(id)){const v=Math.max(3,it.food||Math.round(sellOf(id)/6));S.en=Math.min(EN_MAX,S.en+v);sfx.get();toast(`${it.n} 냠! +${v}⚡`);statUI();save()}return true}
for(const k in CROPS)if(ITEM[k]&&ITEM[k].food==null)ITEM[k].food=Math.max(4,Math.round(CROPS[k].sell/8));
/* 행동 감싸기: 행동력·경험치·가공 시설 */
const _decide=decide;
decide=function(){ensureAlpha();const T=target();if(T){const o=objAt(T[0],T[1]);if(o&&ITEM[o.t]&&ITEM[o.t].mach)return machAct(o)}
 const a=_decide();if(!a||a.dim)return a;const c=COST[a.l];if(c==null)return a;const f=a.f,T2=target();
 a.f=()=>{if(!spend(c))return;const before=S.st.hv;f();const [tx,ty]=T2||[0,0];
  if(a.l==='수확'&&S.st.hv>before){S.today.hv++;const cr=S.C[ty]&&S.C[ty][tx],k=a.ic;addXP(3+(CROPS[k]?CROPS[k].days*2:2),tx,ty)}
  else if(a.l==='심기')addXP(1);else if(c>=4)addXP(2)};
 return a};
/* 가공 시설 */
const mkey=o=>o.x+','+o.y;
function machAct(o){const m=S.mach[mkey(o)],it=ITEM[o.t];
 if(m&&S.day>=m.ready)return{l:'꺼내기',ic:m.out,f:()=>{give(m.out);delete S.mach[mkey(o)];S.today.made++;addXP(10,o.x,o.y);pop(o.x,o.y,'+1 '+ITEM[m.out].n);sfx.get();save()}};
 if(m)return{l:`${ITEM[m.out].n} 만드는 중`,ic:m.out,dim:1,f:()=>toast(`${ITEM[m.out].n}: 내일 아침에 완성돼요`)};
 return{l:it.n,ic:'act_process',f:()=>openMach(o)}}
function openMach(o){const it=ITEM[o.t],L=RECIPES[o.t].map((r,i)=>{const need=Object.entries(r.in),ok=need.every(([k,n])=>count(k)>=n);
  return row(r.out,ITEM[r.out].n,need.map(([k,n])=>`${ITEM[k].n} ${n} (${count(k)})`).join(' + ')+` → 내일 · ${sellOf(r.out)}G`,'넣기',`mk:${o.x},${o.y},${i}`,!ok)});
 openPanel(it.n,L.join('')+'<div class="it"><div></div><div><small>재료를 넣으면 다음 날 아침에 완성돼요. 가공품은 더 비싸게 팔리고, 먹으면 힘이 많이 나요.</small></div><div></div></div>')}
$('pnL').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const [a,v]=b.dataset.a.split(':');if(a!=='mk')return;
 const [mx,my,ri]=v.split(',').map(Number),o=S.O[my][mx],r=RECIPES[o.t][ri];if(!Object.entries(r.in).every(([k,n])=>count(k)>=n))return;
 for(const [k,n] of Object.entries(r.in))take(k,n);S.mach[mx+','+my]={out:r.out,ready:S.day+1};addXP(4);sfx.plant();toast(`${ITEM[r.out].n} 만들기 시작!`);closePanel();save()});
function machBadge(o,t){const m=S.mach&&S.mach[mkey(o)];if(!m)return;const p=iso(o.x+.5,o.y+.5,1.15+Math.sin(t*3)*.04),r=TW*.13;
 if(S.day>=m.ready){x.fillStyle='#fff';x.strokeStyle=OL;x.lineWidth=2*DPR;x.beginPath();x.arc(p[0],p[1],r,0,7);x.fill();x.stroke();const im=ICI[icKey(m.out)];if(im)x.drawImage(im,p[0]-r*.85,p[1]-r*.85,r*1.7,r*1.7)}
 else{x.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<3;i++){const k=(t*.6+i/3)%1;x.globalAlpha=1-k;x.beginPath();x.arc(p[0]+Math.sin(k*6+i)*TW*.04,p[1]-k*TW*.25,TW*(.03+k*.04),0,7);x.fill()}x.globalAlpha=1}}
/* 상점 (레벨 해금) */
openShop=function(){ensureAlpha();const L=[],lock=id=>unlocked(id)?'':`Lv ${unlockLv(id)}에 열려요`;
 const r2=(id,name,desc,price,extra)=>{const lk=lock(id);return row(id,name,lk||desc,lk?'잠김':price+'G','buy:'+id,!!lk||S.gold<price||extra)};
 L.push('<div class="hd">SEEDS · 씨앗</div>');for(const k of Object.keys(CROPS).sort((a,b)=>unlockLv(a)-unlockLv(b))){const id='seed_'+k,it=ITEM[id];L.push(r2(k,it.n,it.desc,it.price).replace(`data-ic="${k}"`,`data-ic="${id}"`).replace(`buy:${k}"`,`buy:${id}"`))}
 L.push('<div class="hd">MACHINE · 가공 시설</div>');for(const id of['keg_pickle','mill','jam_maker','keg_ferment','oven'])L.push(r2(id,ITEM[id].n,ITEM[id].desc,ITEM[id].price));
 L.push('<div class="hd">ANIMAL · 동물</div>');L.push(r2('chicken','닭',ITEM.chicken.desc+` (${S.ck.length}/10)`,ITEM.chicken.price,S.ck.length>=10));
 L.push('<div class="hd">TOOL · 도구</div>');L.push(r2('sprinkler','스프링클러',ITEM.sprinkler.desc,150));
 L.push('<div class="hd">DECO · 꾸미기</div>');for(const id of['flower','bench','lamp','fence'])L.push(r2(id,ITEM[id].n,ITEM[id].desc,ITEM[id].price));
 openPanel(`상점 · ${S.gold.toLocaleString()}G`,L.join(''))};
/* 씨앗 해금 검사: 잠긴 씨앗은 살 수 없지만 이미 가진 것은 심을 수 있어요 */
/* 하루 넘기기 · 잠 · 기절 · 정산 */
const _dayPass=dayPass;dayPass=function(n=1,away=false){ensureAlpha();_dayPass(n,away);S.en=EN_MAX;statUI()};
function canSleep(){return S.min>=19*60||S.en<=0}
const _sleep=sleep;
sleep=function(force){if(state!=='play')return;ensureAlpha();if(!force&&!canSleep()){toast('아직 일러요 · 저녁 7시부터 잘 수 있어요');sfx.no();return}
 const sum={...S.today,day:S.day,gold:S.gold,lv:S.lv};S.today={earn:0,hv:0,made:0,xp:0};_sleep();setTimeout(()=>daySummary(sum),1500)};
function faint(){if(state!=='play')return;ensureAlpha();const lose=Math.min(100,Math.floor(S.gold*.1));S.gold-=lose;const sum={...S.today,day:S.day,gold:S.gold,lv:S.lv,faint:lose};S.today={earn:0,hv:0,made:0,xp:0};
 state='sleep';sfx.sleep();$('fade').classList.add('on');setTimeout(()=>{dayPass(1);S.min=720;S.en=Math.round(EN_MAX*.5);S.pl.x=4.6;S.pl.y=5.6;S.pl.fx=0;S.pl.fy=1;save();hud();statUI();
  setTimeout(()=>{$('fade').classList.remove('on');state='play';daySummary(sum)},500)},900)}
function daySummary(s){const box=(t,v)=>`<div class="it"><div></div><div><b>${t}</b></div><div style="font-weight:900;color:#ffd23f">${v}</div></div>`;
 openPanel(`${s.day}일차 정산`,(s.faint!=null?`<div class="it"><div></div><div><b>너무 늦게까지 일해서 기절했어요</b><small>낮 12시에 일어났어요 · 치료비 ${s.faint}G · 힘 절반만 회복</small></div><div></div></div>`:'')
  +box('오늘 번 돈',(s.earn||0).toLocaleString()+'G')+box('수확',(s.hv||0)+'개')+box('가공품',(s.made||0)+'개')+box('경험치',`+${s.xp||0}`)
  +box('레벨',`Lv ${S.lv} (${S.xp}/${xpNeed(S.lv)})`)+box('가진 돈',S.gold.toLocaleString()+'G')
  +`<div class="it"><div></div><div><small>${S.rain?'오늘은 비가 와서 물을 안 줘도 돼요. ':''}가공 시설에 넣은 재료는 지금 꺼낼 수 있어요.</small></div><div></div></div>`)}
/* 오늘 번 돈 추적 */
const _gainSell=gainSell;gainSell=function(g){ensureAlpha();S.today.earn+=g;_gainSell(g)};
/* 상단 행동력 · 레벨 표시 */
(function(){const f=$('field'),d=document.createElement('div');d.id='stat';d.innerHTML='<div class="lv"><i class="ic lvI"></i><b id="sLv">1</b><span class="xb"><i id="sXp"></i></span></div><div class="en"><i class="ic enI"></i><span class="eb"><i id="sEn"></i></span><b id="sEnT">100</b></div>';f.appendChild(d)})();
function statUI(){if(!S||!$('sLv'))return;ensureAlpha();$('sLv').textContent=S.lv;$('sXp').style.width=Math.min(100,S.xp/xpNeed(S.lv)*100)+'%';$('sEn').style.width=(S.en/EN_MAX*100)+'%';$('sEnT').textContent=Math.round(S.en);$('stat').classList.toggle('low',S.en<=15)}
const _hud=hud;hud=function(){_hud();statUI()};
const _begin=begin;begin=function(){ensureAlpha();_begin();statUI()};
ensureAlpha();statUI();
if(window.__f)Object.assign(window.__f,{openShop,ensureAlpha,faint,addXP,openMach,machAct,sleepN:()=>sleep(),doAct2:()=>doAct(),get ACT(){return decide()}});

})();

</script>
